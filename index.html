<style>
html{color-scheme:dark;height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;height:100%;background:#0a0610;color:#f4ecff;font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-size:9px;line-height:1.6;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#scr{position:fixed;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
button{font-family:inherit;font-size:9px;color:#f4ecff;background:#2a1e40;border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,255,255,.14);min-height:44px;min-width:44px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
button.hot{background:#ff4f8b;color:#1a0010}
button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:flex-start;gap:8px;padding:6px 8px;pointer-events:none;z-index:5}
#top .tl{flex:1;min-width:0;text-shadow:2px 2px 0 #000}
#room{font-size:10px;color:#ffd23f}
#hint{margin-top:4px;color:#e8dcff;font-size:8px;max-width:60ch}
#top .tb{display:flex;gap:6px;pointer-events:auto}
#pad{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(20,12,34,.55);border:3px solid rgba(0,0,0,.8);z-index:5;touch-action:none}
#pad:before,#pad:after{content:"";position:absolute;background:rgba(255,255,255,.12)}
#pad:before{left:58px;top:12px;width:10px;height:102px}#pad:after{top:58px;left:12px;height:10px;width:102px}
#knob{position:absolute;left:41px;top:41px;width:44px;height:44px;border-radius:50%;background:#4a3a6a;border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.2)}

#acts button{height:56px;opacity:.92}
#aJump{background:#c8283c}#aGrab{background:#2c80e0}#aCopy{background:#38a830}#aPaint{background:#b8862a}
#acts #cDance{display:none}
#acts.show #aGrab,#acts.show #aCopy,#acts.show #aPaint{display:none}
#acts.show #cDance{display:block}
#dir{position:fixed;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));display:none;gap:6px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 220px)}
#dir button{opacity:.9}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;text-shadow:2px 2px 0 #000;font-size:11px;transition:opacity .2s;pointer-events:none;z-index:6;white-space:nowrap}
body.port #pad{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.port #acts{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.port #dir{max-width:100%;top:calc(60px + 56.25vw + 8px)}
#music{position:fixed;right:8px;top:calc(60px + env(safe-area-inset-top,0px));width:min(340px,calc(100% - 16px));background:#1a1228;border:3px solid #000;padding:12px;display:none;z-index:9}
#music p{margin:0 0 8px}
#music input{width:100%;box-sizing:border-box;font-family:inherit;font-size:9px;padding:10px;background:#0a0610;color:#fff;border:3px solid #000;margin-bottom:8px;-webkit-user-select:text;user-select:text}
#music .r{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
#yterr{color:#ff8a9a}
#ytwrap{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));top:calc(56px + env(safe-area-inset-top,0px));z-index:8}
#ytbox{display:none;width:176px;height:99px;border:3px solid #000;background:#000}
#ytbox iframe{width:100%;height:100%;border:0}
#ytx{display:none;margin-top:4px}
#builder{position:fixed;inset:0;background:#120c1c;display:none;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;gap:18px;flex-wrap:wrap;align-content:flex-start;justify-content:center}
#builder h1{font-size:13px;margin:0 0 6px;color:#ffd23f;width:100%;text-align:center}
#bleft{display:flex;flex-direction:column;align-items:center;gap:10px}
#pv{width:144px;height:204px;image-rendering:pixelated;background:#2a1e3c;border:3px solid #000}
#opts{display:grid;grid-template-columns:1fr;gap:6px;min-width:280px;max-width:440px;flex:1}
.opt{display:grid;grid-template-columns:96px 44px 1fr 44px;align-items:center;gap:6px}
.ol{color:#b9a8d8}.ov{text-align:center}
#bEnter{background:#ff4f8b;color:#1a0010;padding:12px 16px}

var keys={},pad={x:0,y:0};
function held(dir){
  if(dir==='l'){return keys[37]||keys[65]||pad.x<0;}
  if(dir==='r'){return keys[39]||keys[68]||pad.x>0;}
  if(dir==='u'){return keys[38]||keys[87]||pad.y<0;}
  if(dir==='d'){return keys[40]||keys[83]||pad.y>0;}
}
document.addEventListener('keydown',function(e){
  if(document.activeElement&&document.activeElement.tagName==='INPUT'){return;}
  var k=e.keyCode;keys[k]=true;if(e.repeat){return;}
  if(k===32||k===75){act('jump');e.preventDefault();}
  if(k===74||k===88){act('grab');}
  if(k===67){act('copy');}if(k===86){act('paint');}
  if(k===13){toggleShow();}if(k===71){act('dance');}
  if(k===70){cycleFilter(1);}if(k===81){cycleCam();}if(k===69){cycleFocus();}
  if(k>=37&&k<=40){e.preventDefault();}
});
document.addEventListener('keyup',function(e){keys[e.keyCode]=false;});

/* ---------- helpers ---------- */
function say(t){st.msg=t;st.msgT=1800;}
function itemH(it){if(it.t==='prop'){return DATA.props[it.k].g.length;}return 60;}
function nearest(){
  var list=rooms[st.room];var best=null,bd=1e9;var p=st.p;
  for(var i=0;i<list.length;i++){var it=list[i];var dx=it.x-p.x;var dy=it.y-p.y;
    var rx=it.t==='prop'?Math.max(16,DATA.props[it.k].g[0].length/2+8):18;
    if(Math.abs(dx)<rx&&Math.abs(dy)<12){var d=Math.abs(dx)+Math.abs(dy)*2-(dx*p.dir>0?4:0);if(d<bd){bd=d;best=it;}}}
  return best;
}
function label(it){if(!it){return '';}if(it.t==='prop'){return PROPN[it.k];}if(it.t==='mem'){var m=MEMBERS[it.k];return m.name+' ('+m.role+')';}
  if(it.k==='hat'){return HATN[it.v];}if(it.k==='wings'){return 'Wings';}if(it.k==='face'){return 'Mirror: face style';}return it.v==='cov'?'Coveralls':'Tank and jeans';}
function removeItem(it){var l=rooms[st.room];for(var i=0;i<l.length;i++){if(l[i]===it){l.splice(i,1);return;}}}
function clone(it){return {t:it.t,k:it.k,x:it.x,y:it.y,z:0,tint:it.tint||0};}
function stackZ(it,x,y){
  if(it.t!=='prop'||!DATA.props[it.k].stack){return 0;}
  var l=rooms[st.room];var z=0;
  for(var i=0;i<l.length;i++){var o=l[i];if(o.t==='prop'&&DATA.props[o.k].stack&&Math.abs(o.x-x)<10&&Math.abs(o.y-y)<6){z=Math.max(z,o.z+DATA.props[o.k].h);}}
  return z;
}
function act(a){
  if(st.screen!=='studio'||st.fade>0){return;}
  var p=st.p;
  if(a==='jump'){if(p.z===0&&p.jumps===0){p.vz=0.21;p.jumps=1;sfx('jump');}else if(p.jumps===1){p.vz=0.18;p.jumps=2;sfx('jump2');}return;}
  if(a==='dance'){p.dance=!p.dance;say(p.dance?'Dancing':'Stopped dancing');return;}
  if(a==='grab'){
    if(p.carry){
      var it=p.carry;p.carry=null;
      var supply=(st.room==='inst'||st.room==='lights'||st.room==='ward');
      if(supply&&it.t==='prop'){say('Put back');sfx('drop');return;}
      it.x=Math.max(12,Math.min(VW-12,Math.round(p.x+p.dir*14)));it.y=Math.round(p.y);it.z=stackZ(it,it.x,it.y);
      rooms[st.room].push(it);say(it.z?'Stacked':'Placed');sfx('drop');return;
    }
    var n=nearest();if(!n){say('Nothing to grab here');return;}
    if(n.t==='ward'){wear(n);return;}
    if(n.supply){p.carry=clone(n);}else{removeItem(n);p.carry=n;
      var l=rooms[st.room];for(var i=0;i<l.length;i++){var o=l[i];if(o.t==='prop'&&o.z>n.z&&Math.abs(o.x-n.x)<10&&Math.abs(o.y-n.y)<6){o.z-=itemH(n);if(o.z<0){o.z=0;}}}}
    say('Carrying '+label(p.carry));sfx('grab');return;
  }
  if(a==='copy'){
    var src=p.carry||nearest();
    if(!src||src.t!=='prop'){say(src&&src.t==='mem'?'One of each band member':'Stand next to a prop to copy it');return;}
    var cp=clone(src);
    if(!p.carry){p.carry=cp;say('Copied '+PROPN[cp.k]);}
    else{cp.x=Math.round(p.x-p.dir*14);cp.y=Math.round(p.y);cp.z=stackZ(cp,cp.x,cp.y);rooms[st.room].push(cp);say('Copy placed');}
    sfx('copy');return;
  }
  if(a==='paint'){
    var t=p.carry||nearest();
    if(!t||t.t!=='prop'){say('Stand next to a prop to recolor it');return;}
    t.tint=((t.tint||0)+1)%4;say('New color');sfx('paint');return;
  }
}
function wear(n){
  if(n.k==='hat'){if(LOOK.hat===n.v&&n.v!=='none'){LOOK.hatColor=(LOOK.hatColor+1)%HATC.length;say('Hat color');}else{LOOK.hat=n.v;say(HATN[n.v]);}}
  if(n.k==='wings'){LOOK.wings=(LOOK.wings+1)%WINGC.length;say('Wings: '+WINGN[LOOK.wings]);}
  if(n.k==='face'){LOOK.face=(LOOK.face+1)%FACES.length;say('Face: '+FACEN[FACES[LOOK.face]]);}
  if(n.k==='outfit'){LOOK.outfit=n.v;say(n.v==='cov'?'Coveralls on':'Tank and jeans on');}
  rebuildLead();buildWard();sfx('paint');
  for(var i=0;i<14;i++){st.spark.push({x:st.p.x+(Math.random()*30-15),y:st.p.y-30-Math.random()*40,t:500});}
}

/* ---------- update ---------- */
function update(dt){
  if(st.msgT>0){st.msgT-=dt;}
  if(st.fade>0){
    if(st.pending){st.fade=Math.min(1,st.fade);st.fadeT=(st.fadeT||0)+dt;
      if(st.fadeT>220){var from=st.room;st.room=st.pending;st.pending=null;st.fadeT=0;st.msgT=0;
        if(st.room==='set'){var dx=192;for(var i=0;i<DOORS.length;i++){if(DOORS[i].r===from){dx=DOORS[i].x;}}st.p.x=dx;}else{st.p.x=192;}
        st.p.y=FT+12;st.p.z=0;st.p.vz=0;st.p.jumps=0;ui();}}
    else{st.fade-=dt/240;if(st.fade<0){st.fade=0;}}
  }
  var p=st.p;var sp=0.075,vs=0.05;
  var mx=0,my=0;if(st.fade<=0){if(held('l')){mx=-1;}if(held('r')){mx=1;}if(held('u')){my=-1;}if(held('d')){my=1;}}
  p.moving=(mx!==0||my!==0);if(mx!==0){p.dir=mx;}
  p.x+=mx*sp*dt;p.y+=my*vs*dt;
  p.x=Math.max(10,Math.min(VW-10,p.x));
  if(p.y<FT+4){
    if(my<0&&p.z===0&&!st.show){var tgt=null;
      if(st.room==='set'){for(var d=0;d<DOORS.length;d++){if(Math.abs(p.x-DOORS[d].x)<12){tgt=DOORS[d].r;}}}else if(Math.abs(p.x-192)<12){tgt='set';}
      if(tgt){warp(tgt);}}
    p.y=FT+4;}
  if(p.y>FB){p.y=FB;}
  if(p.jumps>0||p.z>0){p.vz-=0.00085*dt;p.z+=p.vz*dt;if(p.z<=0){p.z=0;p.vz=0;p.jumps=0;}}
  p.anim+=dt;
  if(st.show){
    var bm=60000/st.bpm;st.beatT+=dt;

}
function refreshOpts(){for(var i=0;i<OPTS.length;i++){if(OPTS[i].el){OPTS[i].el.textContent=OPTS[i].v();}}}
function openBuilder(){if(st.show){toggleShow();}st.screen='builder';$('builder').style.display='flex';$('bEnter').textContent=st.started?'Back to the studio':'Enter the studio';refreshOpts();}
bindPress($('bEnter'),function(){st.screen='studio';st.started=true;$('builder').style.display='none';ui();});
var pv=$('pv');var pg=pv.getContext('2d');pg.imageSmoothingEnabled=false;
function drawPreview(t){
  pg.clearRect(0,0,96,136);pg.imageSmoothingEnabled=false;
  var seq=['idle0','idle1','idle0','idle1','walk0','walk1','walk2','walk3','walk0','walk1','walk2','walk3','dance0','dance1','dance0','dance1'];
  var f=leadF[seq[Math.floor(t/300)%seq.length]];
  pg.fillStyle='rgba(0,0,0,0.35)';pg.fillRect(28,128,40,4);
  pg.drawImage(f,0,0,48,68,0,0,96,136);
}

/* ---------- layout ---------- */
function layout(){
  var w=window.innerWidth,h=window.innerHeight;var c=$('scr');var land=w>h;
  document.body.className=land?'land':'port';
  var top=land?0:52;var availH=land?h:Math.min(h-top-230,w*VH/VW);
  var sc=Math.min(w/VW,(land?h:availH)/VH);
  var cw=Math.floor(VW*sc),ch=Math.floor(VH*sc);
  c.style.width=cw+'px';c.style.height=ch+'px';c.style.left=Math.floor((w-cw)/2)+'px';c.style.top=(land?Math.floor((h-ch)/2):top)+'px';
}
window.addEventListener('resize',layout);window.addEventListener('orientationchange',function(){setTimeout(layout,200);});

/* ---------- main loop ---------- */
var last=0;
function loop(t){
  var dt=last?Math.min(50,t-last):16;last=t;
  if(st.screen==='builder'){drawPreview(t);}
  else{update(dt);drawWorld();present();
    var h=hintText();if(h!==lastHint){$('hint').textContent=h;lastHint=h;}
    $('msg').textContent=st.msgT>0?st.msg:'';$('msg').style.opacity=st.msgT>0?1:0;}
  requestAnimationFrame(loop);
}
buildAll();buildOpts();layout();ui();openBuilder();requestAnimationFrame(loop);

</script>
